version: 1

filesystem_policy:
  include_workdir: true
  read_only:
    - /app
    - /usr
    - /lib
    - /lib64
    - /bin
    - /sbin
    - /etc
  read_write:
    - /tmp
    - /sandbox

landlock:
  compatibility: best_effort

process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:
  github_zen:
    name: github-zen-only
    endpoints:
      - host: api.github.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: GET
              path: /zen
    binaries:
      - path: /usr/bin/python3
      - path: /usr/local/bin/python3
  pypi_package_installation:
    endpoints:
      # Target 1: PyPI Package Index Search API
      - host: "pypi.org"
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
      # Target 2: CDN for Wheel/Tarball File Downloads
      - host: "files.pythonhosted.org"
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
    binaries:
      - path: /usr/bin/python3
      - path: /usr/local/bin/python3
      