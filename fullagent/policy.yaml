version: 1

filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /lib64
    - /bin
    - /sbin
    - /etc
  read_write:
    - /tmp
    - /sandbox

landlock:
  compatibility: best_effort

process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:
  wikipedia_web:
    name: allow-wikipedia-webpages
    endpoints:
      - host: en.wikipedia.org
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: GET
              path: /wiki/**
    binaries:
      - path: /usr/bin/python3
      - path: /usr/local/bin/python3
      - path: /usr/local/bin/python3.12
      - path: /usr/bin/curl
